# sel-ani AniDB login
#
# Everything AniDB needs to log you in. Read only when [anidb] enabled = true in
# the config.toml next to this file. Keep it private: sel-ani refuses to read it
# unless only you can.
#   chmod 600 credentials.toml

[anidb]
# The client name and version you registered at https://anidb.net/software/add.
# AniDB rejects unregistered clients.
client = ""
client_version = 0

# Your AniDB username and password.
username = ""
password = ""

# UDP API key, set in your AniDB profile settings. It encrypts the connection;
# without it the password would be sent as plain text, so it is required.
api_key = ""
